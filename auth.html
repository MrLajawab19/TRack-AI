<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TrackAI</title>
    <meta name="description" content="TrackAI Traffic Controller login — secure access to the Delhi–Kanpur train management dashboard.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1e40af',
                        secondary: '#3b82f6',
                        dark: '#1e1e1e',
                        'dark-light': '#2b2b2b'
                    }
                }
            }
        }
    </script>
    <style>
        html { scroll-behavior: smooth; }
        .hero-gradient {
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 50%, #8b5cf6 100%);
        }
        .auth-card {
            backdrop-filter: blur(10px);
            background: rgba(30, 30, 30, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .input-focus:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        .auth-btn {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            transition: all 0.3s ease;
        }
        .auth-btn:hover {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            transform: translateY(-1px);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
        }
        .auth-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <!-- Navigation Bar -->
    <nav class="fixed top-0 w-full bg-gray-900/95 backdrop-blur-md z-50 border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Logo/Brand -->
                <div class="flex-shrink-0">
                    <a href="index.html" class="text-2xl font-bold text-blue-400 hover:text-blue-300 transition-colors">
                        <i class="fas fa-train mr-2"></i>TrackAI
                    </a>
                </div>
                <!-- Navigation Links -->
                <div class="hidden md:block">
                    <div class="ml-10 flex items-baseline space-x-4">
                        <a href="index.html#home" class="nav-link px-3 py-2 rounded-md text-sm font-medium text-gray-300 hover:text-white hover:bg-gray-700 transition-all duration-300">Home</a>
                        <a href="index.html#about" class="nav-link px-3 py-2 rounded-md text-sm font-medium text-gray-300 hover:text-white hover:bg-gray-700 transition-all duration-300">About</a>
                        <a href="index.html#dashboard" class="nav-link px-3 py-2 rounded-md text-sm font-medium text-gray-300 hover:text-white hover:bg-gray-700 transition-all duration-300">Dashboard</a>
                        <a href="index.html#train-status" class="nav-link px-3 py-2 rounded-md text-sm font-medium text-gray-300 hover:text-white hover:bg-gray-700 transition-all duration-300">Train Status</a>
                        <a href="index.html#team" class="nav-link px-3 py-2 rounded-md text-sm font-medium text-gray-300 hover:text-white hover:bg-gray-700 transition-all duration-300">Team</a>
                        <a href="auth.html" class="nav-link px-3 py-2 rounded-md text-sm font-medium bg-gray-700 text-white transition-all duration-300">Login</a>
                    </div>
                </div>
                <!-- Mobile menu button -->
                <div class="md:hidden">
                    <button id="mobile-menu-button" class="text-gray-400 hover:text-white">
                        <i class="fas fa-bars"></i>
                    </button>
                </div>
            </div>
        </div>
        <!-- Mobile menu -->
        <div id="mobile-menu" class="hidden md:hidden">
            <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3 bg-gray-800">
                <a href="index.html#home" class="block px-3 py-2 rounded-md text-base font-medium text-gray-300 hover:text-white hover:bg-gray-700">Home</a>
                <a href="index.html#about" class="block px-3 py-2 rounded-md text-base font-medium text-gray-300 hover:text-white hover:bg-gray-700">About</a>
                <a href="index.html#dashboard" class="block px-3 py-2 rounded-md text-base font-medium text-gray-300 hover:text-white hover:bg-gray-700">Dashboard</a>
                <a href="index.html#train-status" class="block px-3 py-2 rounded-md text-base font-medium text-gray-300 hover:text-white hover:bg-gray-700">Train Status</a>
                <a href="index.html#team" class="block px-3 py-2 rounded-md text-base font-medium text-gray-300 hover:text-white hover:bg-gray-700">Team</a>
                <a href="auth.html" class="block px-3 py-2 rounded-md text-base font-medium bg-gray-700 text-white">Login</a>
            </div>
        </div>
    </nav>

    <!-- Main Authentication Section -->
    <section class="min-h-screen flex items-center justify-center hero-gradient pt-16">
        <div class="max-w-md w-full mx-4">
            <!-- Authentication Card -->
            <div class="auth-card rounded-2xl p-8 shadow-2xl">
                <!-- Header -->
                <div class="text-center mb-8">
                    <div class="text-blue-400 text-4xl mb-4">
                        <i class="fas fa-train"></i>
                    </div>
                    <h1 class="text-3xl font-bold text-white mb-2">TrackAI Control</h1>
                    <p class="text-gray-300">Traffic Controller Access</p>
                </div>

                <!-- Login Form -->
                <div id="loginForm">
                    <form id="loginFormEl" onsubmit="handleLogin(event)" novalidate>
                        <div class="space-y-6">
                            <!-- Email -->
                            <div>
                                <label for="loginEmail" class="block text-sm font-medium text-gray-300 mb-2">
                                    <i class="fas fa-envelope mr-2"></i>Email Address
                                </label>
                                <input
                                    type="email"
                                    id="loginEmail"
                                    name="email"
                                    required
                                    autocomplete="username"
                                    class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 input-focus focus:outline-none transition-all duration-300"
                                    placeholder="Enter your email"
                                >
                            </div>

                            <!-- Password -->
                            <div>
                                <label for="loginPassword" class="block text-sm font-medium text-gray-300 mb-2">
                                    <i class="fas fa-lock mr-2"></i>Password
                                </label>
                                <div class="relative">
                                    <input
                                        type="password"
                                        id="loginPassword"
                                        name="password"
                                        required
                                        autocomplete="current-password"
                                        class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 input-focus focus:outline-none transition-all duration-300"
                                        placeholder="Enter your password"
                                    >
                                    <button
                                        type="button"
                                        onclick="togglePassword('loginPassword')"
                                        class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-300"
                                        aria-label="Toggle password visibility"
                                    >
                                        <i class="fas fa-eye" id="loginPasswordIcon"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- Login Button -->
                            <button
                                type="submit"
                                id="loginBtn"
                                class="w-full py-3 px-4 auth-btn text-white font-semibold rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-gray-800"
                            >
                                <i class="fas fa-sign-in-alt mr-2"></i>Login to TrackAI
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Loading State -->
                <div id="authLoading" class="hidden text-center py-8">
                    <i class="fas fa-spinner fa-spin text-3xl text-blue-400 mb-4"></i>
                    <p class="text-gray-300">Authenticating...</p>
                </div>

                <!-- Error Message -->
                <div id="authError" class="hidden bg-red-900/50 border border-red-500 rounded-lg p-4 mt-6" role="alert">
                    <div class="flex items-center">
                        <i class="fas fa-exclamation-triangle text-red-400 mr-3"></i>
                        <span class="text-red-200" id="authErrorMessage">Error message</span>
                    </div>
                </div>

                <!-- Success Message -->
                <div id="authSuccess" class="hidden bg-green-900/50 border border-green-500 rounded-lg p-4 mt-6" role="status">
                    <div class="flex items-center">
                        <i class="fas fa-check-circle text-green-400 mr-3"></i>
                        <span class="text-green-200" id="authSuccessMessage">Success message</span>
                    </div>
                </div>
            </div>

            <!-- Footer Text -->
            <div class="text-center mt-8">
                <p class="text-gray-400 text-sm">
                    © 2025 TrackAI. Built for SIH 2025 - Problem Statement 25022
                </p>
            </div>
        </div>
    </section>

    <script>
        // ── Password visibility toggle ────────────────────────────────────────
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(inputId + 'Icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }

        // ── UI helpers ────────────────────────────────────────────────────────
        function showLoading() {
            document.getElementById('authLoading').classList.remove('hidden');
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('loginBtn').disabled = true;
        }

        function hideLoading() {
            document.getElementById('authLoading').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('loginBtn').disabled = false;
        }

        function showError(message) {
            const errorDiv = document.getElementById('authError');
            document.getElementById('authErrorMessage').textContent = message;
            errorDiv.classList.remove('hidden');
            document.getElementById('authSuccess').classList.add('hidden');
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('authSuccess');
            document.getElementById('authSuccessMessage').textContent = message;
            successDiv.classList.remove('hidden');
            document.getElementById('authError').classList.add('hidden');
        }

        function hideMessages() {
            document.getElementById('authError').classList.add('hidden');
            document.getElementById('authSuccess').classList.add('hidden');
        }

        // ── Login handler — calls /api/login, never touches credentials ───────
        async function handleLogin(event) {
            event.preventDefault();
            hideMessages();

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) {
                showError('Please enter your email and password.');
                return;
            }

            showLoading();

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    // credentials: 'same-origin' so the Set-Cookie header is accepted
                    credentials: 'same-origin',
                    body: JSON.stringify({ email, password }),
                });

                if (response.ok) {
                    showSuccess('Login successful! Redirecting to dashboard...');
                    // Short delay so the user sees the success state
                    setTimeout(() => {
                        window.location.href = '/dashboard.html';
                    }, 800);
                } else {
                    const data = await response.json().catch(() => ({}));
                    showError(data.detail || 'Invalid email or password.');
                    hideLoading();
                }
            } catch (err) {
                showError('Network error — please check your connection and try again.');
                hideLoading();
            }
        }

        // ── Mobile menu toggle ────────────────────────────────────────────────
        document.getElementById('mobile-menu-button').addEventListener('click', function () {
            document.getElementById('mobile-menu').classList.toggle('hidden');
        });

        // ── On load: if already authenticated, skip straight to dashboard ─────
        document.addEventListener('DOMContentLoaded', async function () {
            const urlParams = new URLSearchParams(window.location.search);
            // Show "session expired" notice if redirected with ?expired=1
            if (urlParams.get('expired') === '1') {
                showError('Your session has expired. Please log in again.');
            }

            try {
                const res = await fetch('/api/me', { credentials: 'same-origin' });
                if (res.ok) {
                    // Already logged in — go to dashboard
                    window.location.replace('/dashboard.html');
                }
            } catch (_) {
                // Not authenticated — stay on login page (normal)
            }
        });
    </script>
</body>
</html>
